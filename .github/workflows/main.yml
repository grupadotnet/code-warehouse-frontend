name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 1. Linting (The "Checkstyle" equivalent for JS/TS)
      - name: Run Lint
        run: npm run lint

      # 2. Build
      - name: Build Project
        run: npm run build

      # 3. Tests
      - name: Run Tests
        run: npm test
